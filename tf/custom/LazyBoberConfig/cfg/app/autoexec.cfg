exec chris               //one of chris' configs
//exec comanglia           //comanglia's max performance config for most decent PCs
//exec rhapsody            //rhapsody's config
//exec cfgtf               //one of the configs from cfg.tf
exec net                 //network settings, unnecesary if you are using a config that 
                                                                    //already has them
exec scripts             //obviously scripts
exec settings            //obviously settings


//mat_antialias 4          //just my preference, i dont like my game pixelated
//mat_monitorgamma 2.2     //just my preference, might be too dark for some people
//r_rimlight 0             //just my preference, lowkey hate rimlight
