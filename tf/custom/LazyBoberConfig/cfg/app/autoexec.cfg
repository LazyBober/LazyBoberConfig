fps_max 400

mat_phong 1; mat_bumpmap 1; mat_specular 1           //default shiny lighting
//mat_phong 0; mat_bumpmap 1; mat_specular 1           //not as shiny lighting
//mat_phong 0; mat_bumpmap 0; mat_specular 0           //even less shiny flat lighting

map_background itemtest; wait 10; disconnect   //loads custom content(.vpk, .vtf, etc.)

//mastercomfig bs
cl_crosshair_file""
crosshair 1

clear