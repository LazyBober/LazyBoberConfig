alias +mfwd "-back;+forward;alias checkfwd +forward"
alias +mback "-forward;+back;alias checkback +back"
alias +mleft "-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd none
alias checkback none
alias checkleft none
alias checkright none
alias none

bind w +mfwd
bind s +mback
bind a +mleft
bind d +mright


alias vmfov "viewmodel_fov"
alias vmfov_up "incrementvar viewmodel_fov 0 150 10"
alias vmfov_down "incrementvar viewmodel_fov 0 150 -10"
bind , "vmfov_down"
bind . "vmfov_up"
bind b changeclass


bindToggle PGDN "tf_use_min_viewmodels"

bind p "hud_reloadscheme"
bind o "snd_restart"

alias vmoff "r_drawviewmodel 0; viewmodel_fov 0; bind shift vmon"
alias vmon "r_drawviewmodel 1; viewmodel_fov 90; bind shift vmoff"
bind shift vmoff


alias +score_ng "+showscores; net_graph 1"
alias -score_ng "-showscores; net_graph 0"
bind TAB "+score_ng"


alias walkway "map tr_walkway_rc2; sv_allow_point_servercommand always"
