// Air strafe script for rocket jumpers and bhopers
// Made by LazyBober

alias +straferight "-left; +right; -moveleft; +moveright; cl_yawspeed 100"
alias -straferight "-right; -moveright"
alias +strafeleft "-right; +left; -moveright; +moveleft; cl_yawspeed 100"
alias -strafeleft "-left; -moveleft"

alias strafeon "bind a "+strafeleft"; bind d "+straferight"; bind ALT "strafeoff""
alias strafeoff "bind a "+moveleft"; bind d "+moveright"; bind ALT "strafeon"; -straferight; -strafeleft; cl_yawspeed 210"

bind a "+moveleft"
bind d "+moveright"

bind ALT "strafeon"